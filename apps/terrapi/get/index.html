<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>テラピをダウンロード</title>
<link rel="icon" href="../img/favicon.png">
<script>
// iPhone/iPad -> App Store, Android -> Google Play, others -> official site.
// Optional tracking: ?src=youtube&c=campaign  (App Store: ct / Play: install referrer utm_*)
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6823927747';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.dotnull.terrapi';
  var SITE = 'https://dotnull.co.jp/apps/terrapi/';
  var APPLE_PT = ''; // App Store Connect provider token (campaign links); leave empty if unused

  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1); // iPadOS desktop mode
  var android = /Android/i.test(ua);

  var q = new URLSearchParams(location.search);
  var src = (q.get('src') || q.get('utm_source') || '').replace(/[^\w.-]/g, '').slice(0, 40);
  var camp = (q.get('c') || q.get('utm_campaign') || '').replace(/[^\w.-]/g, '').slice(0, 40);

  var apple = APP_STORE, play = PLAY;
  if (src) {
    var ct = camp ? src + '-' + camp : src;
    apple += '?' + (APPLE_PT ? 'pt=' + APPLE_PT + '&' : '') + 'ct=' + encodeURIComponent(ct) + '&mt=8';
    var ref = 'utm_source=' + src + '&utm_medium=link' + (camp ? '&utm_campaign=' + camp : '');
    play += '&referrer=' + encodeURIComponent(ref);
  }
  window.__terrapiLinks = { apple: apple, play: play, site: SITE };

  if (ios) location.replace(apple);
  else if (android) location.replace(play);
  else location.replace(SITE);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://dotnull.co.jp/apps/terrapi/"></noscript>
<style>
:root{--bg:#f4f7ef;--lcd:#cfe8c9;--ink:#24352b;--sub:#5c6f62;--btn:#24352b;--btnink:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
main{max-width:360px;width:100%;text-align:center}
.card{background:var(--lcd);border-radius:20px;padding:28px 20px}
img.icon{width:96px;height:96px;border-radius:22px;image-rendering:pixelated}
h1{font-size:20px;margin:14px 0 4px}
p{color:var(--sub);font-size:14px;margin:0 0 20px}
a.b{display:block;background:var(--btn);color:var(--btnink);text-decoration:none;border-radius:12px;padding:14px;font-weight:700;margin:10px 0}
a.s{display:inline-block;margin-top:14px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="icon" src="../img/icon-180.png" alt="テラピ">
    <h1>テラピ</h1>
    <p>ストアを開いています…</p>
    <a class="b" id="a" href="https://apps.apple.com/app/id6823927747">App Store で見る</a>
    <a class="b" id="g" href="https://play.google.com/store/apps/details?id=com.dotnull.terrapi">Google Play で見る</a>
  </div>
  <a class="s" href="https://dotnull.co.jp/apps/terrapi/">公式サイトへ</a>
</main>
<script>
var L = window.__terrapiLinks;
if (L) { document.getElementById('a').href = L.apple; document.getElementById('g').href = L.play; }
</script>
</body>
</html>
